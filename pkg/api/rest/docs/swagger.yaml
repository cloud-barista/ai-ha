        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreProgressReq'
      produces:
      - application/json
      responses:
        "204":
          description: Progress recorded
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
