      consumes:
      - application/json
      description: 'Register an S3 repository (AWS or MinIO) that backups can write
        to. The credentials are stored encrypted, and an agent receives them only
        with a job it has claimed. The location cannot be changed afterwards: register
        a new repository for a new location. Whether the repository can be reached
        is not checked here.'
      operationId: PostRepository
      parameters:
      - description: Repository to register
        in: body
        name: repositoryReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The repository's address
              type: string
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Register a backup repository
      tags:
      - '[Protection] Repository Management'
  /repositories/{repoId}:
    get:
      description: Return a registered repository, without its credentials.
      operationId: GetRepository
      parameters:
      - description: Repository ID or name
        in: path
        name: repoId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Get a backup repository
      tags:
      - '[Protection] Repository Management'
  /repositories/{repoId}/credentials:
    put:
      consumes:
      - application/json
      description: Replace a repository's credentials, keeping its ID and location,
        so jobs and backup sets that name it stay valid. The old credentials are not
        read, which also recovers a repository whose secret key was lost.
      operationId: PutRepositoryCredentials
      parameters:
      - description: Repository ID or name
        in: path
        name: repoId
        required: true
        type: string
      - description: New credentials
        in: body
        name: repositoryCredentialsReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryCredentialsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Replace a repository's credentials
      tags:
      - '[Protection] Repository Management'
  /repositories/{repoId}/verify:
    post:
      consumes:
      - application/json
      description: 'Not implemented yet: answers 501. A check from the framework says
        nothing about whether an agent inside a customer network can write there,
        so a real answer needs a job an agent carries out.'
      operationId: PostRepositoryVerify
      parameters:
      - description: Repository ID or name
        in: path
        name: repoId
        required: true
        type: string
      - description: Who checks
        in: body
        name: repositoryVerifyReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryVerifyReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Check that a repository can be reached
      tags:
      - '[Protection] Repository Management'
  /restores:
    get:
      description: List restore jobs, newest first.
      operationId: GetRestores
      parameters:
      - description: Only restores of this source system
        in: query
        name: systemId
        type: string
      - description: Only restores of this backup set
        in: query
        name: backupSetId
        type: string
      - description: Only restores in this status
        enum:
        - awaiting_agent
        - claimed
        - restoring
        - awaiting_boot
        - failed
        in: query
        name: status
        type: string
      - description: Only restores requested at or after this time (RFC 3339)
        in: query
        name: from
        type: string
      - description: Only restores requested before this time (RFC 3339)
        in: query
        name: to
        type: string
      - default: 50
        description: How many to return, 1-200
        in: query
        name: limit
        type: integer
      - default: 0
        description: How many to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreListResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: List the restore history
      tags:
      - '[Protection] Restore Management'
    post:
      consumes:
      - application/json
      description: 'Register a restore job for a backup set and return at once: follow
        it at the address in the Location header. The set must be one a backup job
        reported as completed; that job says which system it captured and which repository
        holds it. Target instances are still created by hand, so the response carries,
        this once, what the instance''s init script needs, including its claim token.
        "Completed" is what the agent reported: whether the files are still in the
        repository is found out by the rescue agent. Requests are not deduplicated
        yet: repeating one registers another job.'
      operationId: PostRestore
      parameters:
      - description: Restore request
        in: body
        name: restoreReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: Where to follow the restore
              type: string
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreAcceptedResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Request a restore
      tags:
      - '[Protection] Restore Management'
  /restores/{restoreId}:
    get:
      description: Return a restore's status, the step its rescue agent is on and
        how much of the backup files it has read. A status of awaiting_boot means
        the disk was restored; the restored system's boot has not been confirmed.
      operationId: GetRestore
      parameters:
      - description: Restore ID
        in: path
        name: restoreId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Get a restore
      tags:
      - '[Protection] Restore Management'
  /restores/{restoreId}/cancel:
    post:
      description: 'Not implemented yet: answers 501. A rescue agent has no path to
        receive a cancel, and past formatting a stopped restore does not return the
        disk to its earlier state.'
      operationId: PostRestoreCancel
      parameters:
      - description: Restore ID
        in: path
        name: restoreId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Ask a restore to stop
      tags:
      - '[Protection] Restore Management'
  /swagger.json:
    get:
      description: Return the generated OpenAPI (Swagger) document describing this
        API.
      operationId: GetSwaggerSpec
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get the OpenAPI specification
      tags:
      - '[Admin] System Management'
  /systems:
    get:
      description: List the systems an agent has enrolled for, most recently enrolled
        first, with the state of the agent speaking for each. An online agent is reachable;
        that does not say its work is healthy.
      operationId: GetSystems
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.ProtectedSystemListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: List protected systems
      tags:
      - '[Protection] System Management'
  /systems/{systemId}:
    get:
      description: Return one protected system and how current its inventory is. The
        inventory is absent until the agent first reports.
      operationId: GetSystem
      parameters:
      - description: System ID
        in: path
        name: systemId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.ProtectedSystemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Get a protected system
      tags:
      - '[Protection] System Management'
  /systems/{systemId}/backups:
    post:
      consumes:
      - application/json
      description: 'Queue a backup job for the system''s agent and return at once:
        follow the job at the address in the Location header. With no devices the
        partitions are chosen from what the agent reported; a system whose report
        is missing or incomplete is refused, because a set chosen from it could leave
        out a filesystem the system needs, and only the restore would show it. Named
        devices are checked against the same report. If there is no report yet they
        are accepted unchecked, with a warning, and the agent checks them before it
        writes. Requests are not deduplicated yet: repeating one queues another job.'
      operationId: PostSystemBackup
      parameters:
      - description: System ID
        in: path
        name: systemId
        required: true
        type: string
      - description: Backup request
        in: body
        name: backupReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: Where to follow the job
              type: string
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupAcceptedResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Request a backup of a system
      tags:
      - '[Protection] Backup Management'
  /systems/{systemId}/inventory:
    get:
      description: 'Return what the system''s agent last reported. The framework cannot
        read a system itself, so this is always a past reading: check when it was
        collected before relying on it.'
      operationId: GetSystemInventory
      parameters:
      - description: System ID
        in: path
        name: systemId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SystemInventoryInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Get what a system is made of
      tags:
      - '[Protection] System Management'
  /systems/{systemId}/inventory/refresh:
    post:
      description: 'Not implemented yet: answers 501. Agents report on startup and
        periodically, and no job kind carries this request to them.'
      operationId: PostSystemInventoryRefresh
      parameters:
      - description: System ID
        in: path
        name: systemId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Ask a system's agent to report its inventory again
      tags:
      - '[Protection] System Management'
  /systems/{systemId}/targets:
    put:
      consumes:
      - application/json
      description: 'Not implemented yet: answers 501. Targets are chosen per backup
        request, from the inventory or by name.'
      operationId: PutSystemTargets
      parameters:
      - description: System ID
        in: path
        name: systemId
        required: true
        type: string
      - description: Backup targets
        in: body
        name: backupTargetsReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupTargetsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AdminToken: []
      summary: Set what a system's backups capture
      tags:
      - '[Protection] System Management'
securityDefinitions:
  AdminToken:
    description: Management API token, as "Bearer <token>". It is the file named by
      AIHA_FRAMEWORK_ADMIN_TOKEN_FILE.
    in: header
    name: Authorization
    type: apiKey
  AgentToken:
    description: The agent's own token, as "Bearer <token>", issued at enrolment.
    in: header
    name: Authorization
    type: apiKey
  RestoreReportToken:
    description: The rescue agent's report token, as "Bearer <token>", issued in the
      claim response.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
