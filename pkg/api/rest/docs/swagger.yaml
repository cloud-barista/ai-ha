basePath: /aiha
definitions:
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentInfo:
    properties:
      agentId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      agentVersion:
        example: aiha-agent 0.1.0
        type: string
      hostname:
        example: web01
        type: string
      lastSeenAt:
        type: string
      mode:
        example: normal
        type: string
      registeredAt:
        type: string
      registrationTokenId:
        description: |-
          RegistrationTokenID is the token that enrolled the agent, which finds an
          agent that never received its enrolment response.
        example: 4b5c6d7e8f9a0b1c
        type: string
      revokedAt:
        type: string
      status:
        description: Status is online, offline or revoked.
        example: online
        type: string
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentInventoryReq:
    properties:
      architecture:
        example: x86_64
        maxLength: 64
        type: string
      collectedAt:
        description: |-
          CollectedAt is when the agent read the system, which is not when the
          framework heard about it. Backup targets chosen from a stale inventory
          can name a partition that no longer exists.
        example: "2026-09-18T04:05:06Z"
        type: string
      complete:
        description: |-
          Complete is false when the agent could not account for every filesystem
          the system needs. Backup targets are not chosen automatically from an
          inventory that says so.
        example: true
        type: boolean
      firmware:
        example: uefi
        maxLength: 16
        type: string
      incompleteReason:
        description: IncompleteReason explains Complete being false, in an operator's
          terms.
        maxLength: 1024
        type: string
      kernelRelease:
        example: 6.8.0-45-generic
        maxLength: 256
        type: string
      missing:
        description: Missing names the filesystems that were unaccounted for, e.g.
          "/boot/efi".
        items:
          type: string
        maxItems: 64
        type: array
      osId:
        example: ubuntu
        maxLength: 64
        type: string
      osVersionId:
        example: "24.04"
        maxLength: 64
        type: string
      partitions:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.InventoryPartition'
        maxItems: 128
        minItems: 1
        type: array
    required:
    - collectedAt
    - partitions
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJob:
    properties:
      jobId:
        example: 5e6f70819a0b1c2d
        type: string
      kind:
        example: backup
        type: string
      spec:
        description: Spec is what to do, passed through as the job was created.
        type: object
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobClaimReq:
    properties:
      claimRequestKey:
        description: |-
          ClaimRequestKey scopes idempotency to this one request. A retry reuses
          it; a stale request with a different key cannot join a newer attempt.
          32 hexadecimal digits.
        example: 8b1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f
        type: string
    required:
    - claimRequestKey
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobClaimResp:
    properties:
      attemptId:
        example: 7a8b9c0d1e2f3a4b
        type: string
      jobId:
        example: 5e6f70819a0b1c2d
        type: string
      leaseSeconds:
        example: 90
        type: integer
      leaseToken:
        description: |-
          LeaseToken proves this attempt is current. Every report carries it. It
          is returned only here.
        example: <lease-token>
        type: string
      progressIntervalSeconds:
        description: |-
          ProgressIntervalSeconds is how often to report, whether or not the work
          has advanced. LeaseSeconds is how long a report buys. They are sent here
          rather than compiled into the agent so that they can be tuned without
          redeploying.
        example: 10
        type: integer
      repository:
        allOf:
        - $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryAccess'
        description: |-
          Repository is where the job writes, with the credentials to do so. It is
          sent only in this response and stored nowhere with the job.
      spec:
        type: object
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobProgressReq:
    properties:
      advanced:
        description: |-
          Advanced says whether the work moved since the last report. A report
          that only proves the agent is alive sets it false, which keeps an agent
          that is up but stuck distinguishable from one that is gone.
        example: true
        type: boolean
      attemptId:
        example: 7a8b9c0d1e2f3a4b
        type: string
      leaseToken:
        example: <lease-token>
        type: string
      phase:
        example: archiving
        type: string
      processedBytes:
        description: ProcessedBytes is how much has been uploaded so far.
        example: 1048576
        type: integer
      seq:
        description: Seq orders reports within an attempt. An older one is ignored.
        example: 3
        minimum: 1
        type: integer
    required:
    - attemptId
    - leaseToken
    - seq
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobProgressResp:
    properties:
      cancelRequested:
        description: |-
          CancelRequested tells the agent to stop. There is no inbound path to an
          agent, so this is the only way a cancel can reach it.
        example: false
        type: boolean
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobResultReq:
    properties:
      attemptId:
        example: 7a8b9c0d1e2f3a4b
        type: string
      detail:
        description: Detail is what the attempt produced, recorded as reported.
        type: object
      leaseToken:
        example: <lease-token>
        type: string
      message:
        example: Backup set 9c0d1e2f3a4b5c6d captured
        type: string
      outcome:
        description: Outcome is completed, failed or cancelled.
        enum:
        - completed
        - failed
        - cancelled
        example: completed
        type: string
    required:
    - attemptId
    - leaseToken
    - outcome
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentRegisterReq:
    properties:
      agentVersion:
        example: aiha-agent 0.1.0
        type: string
      hostname:
        description: Hostname and AgentVersion are recorded for display and diagnosis.
        example: web01
        type: string
      registrationKey:
        description: |-
          RegistrationKey identifies this enrolment attempt. A retry reuses it so
          that the framework recognises a repeat instead of enrolling a second
          agent. 32 hexadecimal digits.
        example: 3f2a9c1e6b7d4a805e1f9c2d8b0a7e63
        type: string
      registrationToken:
        description: |-
          RegistrationToken authorizes the enrolment. It is spent by a successful
          registration and authorizes nothing else: it cannot receive work.
        example: <registration-token>
        type: string
      systemId:
        description: |-
          SystemID is the machine this agent protects. The agent proposes it; what
          makes the enrolment legitimate is the registration token, never this.
        example: 1a2b3c4d5e6f7081
        type: string
    required:
    - registrationKey
    - registrationToken
    - systemId
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentRegisterResp:
    properties:
      agentId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      agentToken:
        description: AgentToken authenticates every later request, as a bearer token.
        example: <agent-token>
        type: string
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupAcceptedResp:
    properties:
      devices:
        description: Devices are the partitions the job will capture.
        example:
        - /dev/nvme0n1p1
        items:
          type: string
        type: array
      expiresAt:
        type: string
      jobId:
        example: 5e6f70819a0b1c2d
        type: string
      status:
        example: queued
        type: string
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
      warnings:
        description: |-
          Warnings are reasons to look twice that did not stop the request, such
          as an inventory too old to trust.
        items:
          type: string
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupInfo:
    properties:
      backupSetId:
        example: 9c0d1e2f3a4b5c6d
        type: string
      compression:
        example: zstd
        type: string
      createdAt:
        type: string
      devices:
        example:
        - /dev/nvme0n1p1
        items:
          type: string
        type: array
      finishedAt:
        type: string
      items:
        description: |-
          Items is how many backup files the set holds, and Manifest names the
          file describing them in the repository.
        example: 3
        type: integer
      jobId:
        example: 5e6f70819a0b1c2d
        type: string
      manifest:
        example: 9c0d1e2f3a4b5c6d-manifest.json
        type: string
      message:
        example: Backup set 9c0d1e2f3a4b5c6d (completed, 3 item(s))
        type: string
      processedBytes:
        description: ProcessedBytes is how much was uploaded, compressed.
        example: 1048576
        type: integer
      repositoryId:
        example: 3f2a9c1e6b7d4a80
        type: string
      requestedBy:
        example: admin
        type: string
      setStatus:
        description: |-
          SetStatus is the set's own status as the agent reported it, which can be
          partial when some of its items failed.
        example: completed
        type: string
      startedAt:
        type: string
      status:
        description: Status is the job's status.
        example: completed
        type: string
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupReq:
    properties:
      compression:
        description: Compression names the codec, empty for the default.
        enum:
        - zstd
        - none
        example: zstd
        type: string
      devices:
        description: |-
          Devices are the partitions to capture. Left out, they are chosen from
          what the system's agent reported.
        example:
        - /dev/nvme0n1p1
        items:
          type: string
        maxItems: 128
        type: array
        uniqueItems: true
      repositoryId:
        description: RepositoryID is the ID or name of the registered repository to
          write to.
        example: 3f2a9c1e6b7d4a80
        maxLength: 255
        type: string
    required:
    - devices
    - repositoryId
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.BackupTargetsReq:
    properties:
      devices:
        example:
        - /dev/nvme0n1p1
        items:
          type: string
        maxItems: 128
        minItems: 1
        type: array
        uniqueItems: true
    required:
    - devices
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.FrameworkAccess:
    properties:
      certPin:
        description: |-
          CertPin says the agent pins the certificate named by CertSHA256, for a
          self-signed certificate. False means it verifies the certificate against
          its CA bundle, and CertSHA256 is empty.
        example: true
        type: boolean
      certSha256:
        example: 3911ba8d8fe5db35ae90469636dcd464c8b7aee357dc1bf9f9e6d8db3b77e81e
        type: string
      url:
        example: https://framework.example.com:8443
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAApproval:
    properties:
      approvedBy:
        example: operator@example.com
        maxLength: 255
        type: string
      incidentId:
        description: IncidentID links the action to the incident it answers, if any.
        example: 7c8d9e0f1a2b3c4d
        maxLength: 64
        type: string
      reason:
        example: Planned maintenance
        maxLength: 1024
        type: string
    required:
    - approvedBy
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAEvent:
    properties:
      at:
        type: string
      from:
        example: protected
        type: string
      groupId:
        example: 6a7b8c9d0e1f2a3b
        type: string
      kind:
        example: state_changed
        type: string
      reason:
        example: Replication disconnected
        type: string
      seq:
        example: 42
        type: integer
      to:
        example: degraded
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAEventListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAEvent'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAFailoverReq:
    properties:
      acceptDataLoss:
        example: false
        type: boolean
      approvedBy:
        example: operator@example.com
        maxLength: 255
        type: string
      confirmFenced:
        example: true
        type: boolean
      incidentId:
        description: IncidentID links the action to the incident it answers, if any.
        example: 7c8d9e0f1a2b3c4d
        maxLength: 64
        type: string
      reason:
        example: Planned maintenance
        maxLength: 1024
        type: string
    required:
    - approvedBy
    - confirmFenced
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAGroupInfo:
    properties:
      createdAt:
        type: string
      groupId:
        example: 6a7b8c9d0e1f2a3b
        type: string
      name:
        example: inference-ha
        type: string
      primary:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HANodeStatus'
      reasons:
        items:
          type: string
        type: array
      resource:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAResourceSpec'
      service:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAServiceSpec'
      serviceAddress:
        example: 10.0.1.20:8000
        type: string
      standby:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HANodeStatus'
      state:
        description: |-
          State is registered, configuring, syncing, protected, degraded,
          failover_pending, switching or error. It governs what may be done next.
        example: protected
        type: string
      verdict:
        description: |-
          Verdict is ok, attention or error, derived anew at each evaluation, and
          Reasons explains it. It is not State: a broken replication link is a
          verdict of error on a group that is degraded.
        example: ok
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAGroupListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAGroupInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAGroupReq:
    properties:
      name:
        example: inference-ha
        maxLength: 63
        type: string
      primarySystemId:
        example: 1a2b3c4d5e6f7081
        type: string
      resource:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAResourceSpec'
      service:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAServiceSpec'
      serviceAddress:
        description: |-
          ServiceAddress is where clients reach the service. It is recorded so
          that a completed switch can say what to repoint.
        example: 10.0.1.20:8000
        maxLength: 2048
        type: string
      standbySystemId:
        example: 2b3c4d5e6f708192
        type: string
    required:
    - name
    - primarySystemId
    - standbySystemId
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HANodeStatus:
    properties:
      gpusSeen:
        example: 1
        type: integer
      healthCode:
        example: 200
        type: integer
      healthLatencyMs:
        example: 35
        type: integer
      portOpen:
        example: true
        type: boolean
      replication:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAReplicationStatus'
      reportedAt:
        type: string
      role:
        description: Role is primary or standby.
        example: primary
        type: string
      serviceUp:
        example: true
        type: boolean
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAReplicationStatus:
    properties:
      connection:
        example: Connected
        type: string
      disk:
        example: UpToDate
        type: string
      error:
        type: string
      outOfSyncBytes:
        example: 0
        type: integer
      role:
        example: Primary
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAResourceSpec:
    properties:
      backingDisk:
        example: /dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_vol0123
        maxLength: 4096
        type: string
      device:
        description: |-
          Device is what the filesystem sits on, and BackingDisk the volume holding
          the data on each node, as a stable by-id path.
        example: /dev/drbd0
        maxLength: 4096
        type: string
      mountPoint:
        example: /data
        maxLength: 4096
        type: string
      name:
        description: |-
          Name identifies the replication resource. Empty has the framework issue
          one; set, it adopts a resource that already exists.
        example: aiha-r0
        maxLength: 63
        type: string
      port:
        example: 7789
        maximum: 65535
        minimum: 1
        type: integer
    required:
    - backingDisk
    - device
    - mountPoint
    - port
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HAServiceSpec:
    properties:
      expectedGpus:
        description: |-
          ExpectedGPUs is how many accelerators each node must see. Zero skips
          the check.
        example: 1
        minimum: 0
        type: integer
      healthPath:
        example: /healthz
        maxLength: 2048
        type: string
      port:
        example: 8000
        maximum: 65535
        minimum: 1
        type: integer
      unit:
        example: ai-service.service
        maxLength: 255
        type: string
    required:
    - port
    - unit
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HATransitionInfo:
    properties:
      approvedBy:
        example: operator@example.com
        type: string
      dataLossAccepted:
        example: false
        type: boolean
      fencingConfirmed:
        example: false
        type: boolean
      finishedAt:
        type: string
      groupId:
        example: 6a7b8c9d0e1f2a3b
        type: string
      incidentId:
        example: 7c8d9e0f1a2b3c4d
        type: string
      jobIds:
        items:
          type: string
        type: array
      kind:
        description: Kind is switchover, failover, resume or rejoin.
        example: switchover
        type: string
      message:
        type: string
      phase:
        example: demoting
        type: string
      requestedBy:
        example: admin
        type: string
      startedAt:
        type: string
      status:
        description: |-
          Status is pending, running, completed or failed, and Phase the step it
          is on.
        example: running
        type: string
      transitionId:
        example: 8d9e0f1a2b3c4d5e
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.HATransitionListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.HATransitionInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.InventoryPartition:
    properties:
      candidate:
        description: |-
          Candidate says this partition is included when backup targets are chosen
          automatically. Selectable says it may be named by hand. They differ: a
          partition can be selectable without being a candidate, while one that is
          not selectable cannot be captured at all and is refused even when asked
          for by name.
        type: boolean
      devNo:
        example: "259:1"
        maxLength: 32
        type: string
      device:
        description: |-
          Device is the canonical device path. It is resolved from the mount's
          device number rather than copied from the mount table, whose source name
          can be an alias ("/dev/root" on cloud images) that cannot be backed up.
          It is empty when the path could not be resolved, which is why it is not
          required: a partition that is present but unreadable reads very
          differently from one that is absent.
        example: /dev/nvme0n1p1
        maxLength: 4096
        type: string
      fsSizeBytes:
        description: |-
          FSSizeBytes and FSUsedBytes are the filesystem's size and usage, not the
          device's. Null means the value could not be determined, which is not the
          same as a filesystem that is empty.
        example: 8298131456
        type: integer
      fsType:
        example: ext4
        maxLength: 64
        type: string
      fsUsedBytes:
        example: 2147483648
        type: integer
      fsUuid:
        example: 11111111-2222-3333-4444-555555555555
        maxLength: 128
        type: string
      label:
        maxLength: 256
        type: string
      mountPoint:
        example: /
        maxLength: 4096
        type: string
      partUuid:
        maxLength: 128
        type: string
      reason:
        description: Reason explains a false in either flag, in an operator's terms.
        maxLength: 512
        type: string
      selectable:
        type: boolean
    required:
    - mountPoint
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.InventorySummary:
    properties:
      collectedAt:
        type: string
      complete:
        description: |-
          Complete is false when the agent could not account for every filesystem
          the system needs. Backup targets are then not chosen automatically.
        example: true
        type: boolean
      reportedAt:
        type: string
      stale:
        description: Stale says the reading is old enough that the system may have
          changed.
        example: false
        type: boolean
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.JobAttemptInfo:
    properties:
      agentId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      attemptId:
        example: 7a8b9c0d1e2f3a4b
        type: string
      finishedAt:
        type: string
      lastProgressAt:
        type: string
      lastSeenAt:
        description: |-
          LastSeenAt moves with every report and LastProgressAt only when the work
          advanced, so an agent that is alive but stuck can be told from one that
          is gone. LeaseExpiresAt is when the attempt loses its authority.
        type: string
      leaseExpiresAt:
        type: string
      message:
        type: string
      outcome:
        description: |-
          Outcome is completed, failed, cancelled or unknown; unknown means the
          agent stopped reporting, which is not a confirmed failure.
        example: completed
        type: string
      phase:
        example: archiving
        type: string
      processedBytes:
        description: |-
          ProcessedBytes is how much has been handled so far. TotalUnknown says
          there is no total to set it against: show throughput and elapsed time
          rather than a percentage.
        example: 1048576
        type: integer
      result:
        description: Result is what the agent reported producing, recorded as reported.
        type: object
      totalUnknown:
        example: true
        type: boolean
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.JobInfo:
    properties:
      attempt:
        allOf:
        - $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.JobAttemptInfo'
        description: |-
          Attempt is the execution in progress or the last one. It is absent until
          an agent claims the job, and in lists.
      cancelRequested:
        description: |-
          CancelRequested says a cancel was asked for. A running job only stops
          once its agent confirms it.
        example: false
        type: boolean
      createdAt:
        type: string
      expiresAt:
        type: string
      finishedAt:
        type: string
      jobId:
        example: 5e6f70819a0b1c2d
        type: string
      kind:
        example: backup
        type: string
      message:
        example: Backup set 9c0d1e2f3a4b5c6d (completed, 3 item(s))
        type: string
      requestedBy:
        example: admin
        type: string
      spec:
        description: Spec is what the agent was asked to do. It holds no credentials.
        type: object
      startedAt:
        type: string
      status:
        description: |-
          Status is queued, claimed, running, cancelling, completed, failed or
          cancelled.
        example: running
        type: string
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.JobListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.JobInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.ProtectedSystem:
    properties:
      agentId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      agentStatus:
        description: |-
          AgentStatus is online, offline or revoked. Online says the agent is
          reachable, not that the system's work is healthy: an agent can be alive
          while its job is stuck.
        example: online
        type: string
      agentVersion:
        example: aiha-agent 0.1.0
        type: string
      hostname:
        example: web01
        type: string
      lastSeenAt:
        type: string
      registeredAt:
        type: string
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.ProtectedSystemDetail:
    properties:
      agentId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      agentStatus:
        description: |-
          AgentStatus is online, offline or revoked. Online says the agent is
          reachable, not that the system's work is healthy: an agent can be alive
          while its job is stuck.
        example: online
        type: string
      agentVersion:
        example: aiha-agent 0.1.0
        type: string
      hostname:
        example: web01
        type: string
      inventory:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.InventorySummary'
      lastSeenAt:
        type: string
      registeredAt:
        type: string
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.ProtectedSystemListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.ProtectedSystem'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RegistrationTokenInfo:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      maxUses:
        example: 1
        type: integer
      note:
        example: web01 rollout
        type: string
      revokedAt:
        type: string
      status:
        description: Status is usable, used_up, expired or revoked.
        example: usable
        type: string
      tokenId:
        example: 4b5c6d7e8f9a0b1c
        type: string
      uses:
        example: 0
        type: integer
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RegistrationTokenIssuedResp:
    properties:
      expiresAt:
        type: string
      framework:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.FrameworkAccess'
      maxUses:
        example: 1
        type: integer
      token:
        example: <registration-token>
        type: string
      tokenId:
        example: 4b5c6d7e8f9a0b1c
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RegistrationTokenListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RegistrationTokenInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RegistrationTokenReq:
    properties:
      maxUses:
        description: MaxUses is how many agents the token may enrol.
        example: 1
        maximum: 10000
        minimum: 0
        type: integer
      note:
        description: Note records what the token was issued for.
        example: web01 rollout
        maxLength: 512
        type: string
      ttlSeconds:
        description: TTLSeconds is how long the token may be used to enrol, at most
          a week.
        example: 1800
        maximum: 604800
        minimum: 0
        type: integer
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryAccess:
    properties:
      accessKey:
        example: <access-key>
        type: string
      bucket:
        example: aiha-backup
        type: string
      endpoint:
        example: https://storage.example.com:9000
        type: string
      prefix:
        example: systems/web01
        type: string
      provider:
        example: Minio
        type: string
      region:
        example: us-east-1
        type: string
      secretKey:
        example: <secret-key>
        type: string
      sessionToken:
        example: <session-token>
        type: string
      type:
        example: s3
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryCredentialsReq:
    properties:
      accessKey:
        example: <access-key>
        maxLength: 1024
        type: string
      secretKey:
        example: <secret-key>
        maxLength: 1024
        type: string
      sessionToken:
        description: |-
          SessionToken makes the credentials temporary. It is not renewed by the
          framework: replace the credentials when it expires.
        example: <session-token>
        maxLength: 4096
        type: string
    required:
    - accessKey
    - secretKey
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryInfo:
    properties:
      bucket:
        example: aiha-backup
        type: string
      createdAt:
        type: string
      credentialsUpdatedAt:
        type: string
      endpoint:
        example: https://storage.example.com:9000
        type: string
      hasSessionToken:
        description: |-
          HasSessionToken says whether the credentials include a session token,
          which expires and is not renewed by the framework.
        type: boolean
      id:
        example: 3f2a9c1e6b7d4a80
        type: string
      name:
        example: minio-main
        type: string
      prefix:
        example: prod
        type: string
      provider:
        example: Minio
        type: string
      region:
        example: us-east-1
        type: string
      type:
        example: s3
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryReq:
    properties:
      accessKey:
        example: <access-key>
        maxLength: 1024
        type: string
      bucket:
        example: aiha-backup
        maxLength: 63
        type: string
      endpoint:
        description: Endpoint is the URL of an S3-compatible service, empty for AWS.
        example: https://storage.example.com:9000
        maxLength: 2048
        type: string
      name:
        example: minio-main
        maxLength: 63
        type: string
      prefix:
        example: prod
        maxLength: 1024
        type: string
      provider:
        description: Provider is AWS or Minio.
        enum:
        - AWS
        - Minio
        example: Minio
        type: string
      region:
        description: Region is required for AWS.
        example: us-east-1
        maxLength: 64
        type: string
      secretKey:
        example: <secret-key>
        maxLength: 1024
        type: string
      sessionToken:
        description: |-
          SessionToken makes the credentials temporary. It is not renewed by the
          framework: replace the credentials when it expires.
        example: <session-token>
        maxLength: 4096
        type: string
    required:
    - accessKey
    - bucket
    - name
    - provider
    - secretKey
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryVerifyReq:
    properties:
      verifier:
        description: |-
          Verifier is who checks: "framework", or "agent:<systemId>" to learn
          whether that agent can really write there. Only the second predicts
          whether a backup will succeed.
        example: agent:1a2b3c4d5e6f7081
        type: string
    required:
    - verifier
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RescueAccess:
    properties:
      claimToken:
        example: <claim-token>
        type: string
      framework:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.FrameworkAccess'
      recoveryId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreAcceptedResp:
    properties:
      claimExpiresAt:
        description: ClaimExpiresAt is when the rescue agent must have claimed the
          job by.
        type: string
      rescue:
        allOf:
        - $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RescueAccess'
        description: |-
          Rescue is what a rescue instance needs to take the job on. Target
          instances are still created by hand, so the caller has to carry these
          into the instance's init script. It is returned only here.
      restoreId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      status:
        example: awaiting_agent
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreClaimReq:
    properties:
      claimToken:
        description: |-
          ClaimToken is the one-time secret injected through the instance's init
          script.
        example: <claim-token>
        type: string
      requestKey:
        description: |-
          RequestKey identifies this agent's claim. Retries reuse it so that a
          response lost in transit can be fetched again.
        example: 3f2a9c1e6b7d4a80
        type: string
    required:
    - claimToken
    - requestKey
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreClaimResp:
    properties:
      plan:
        description: Plan is passed through as registered; its schema is RestorePlan.
        type: object
      recoveryId:
        example: 1a2b3c4d5e6f7081
        type: string
      reportToken:
        description: |-
          ReportToken authenticates this agent's progress and result reports for
          the restore. A new one is issued on every claim response, redeliveries
          included, and only the latest is accepted. It is a secret.
        example: <report-token>
        type: string
      repository:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RepositoryAccess'
      restoreId:
        example: 9b1c2d3e4f5a6b7c
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreInfo:
    properties:
      bootVerification:
        description: |-
          BootVerification is pending while the restored system's boot waits to be
          confirmed. Confirming it is not implemented yet, so it stays pending.
        example: pending
        type: string
      claimExpiresAt:
        type: string
      claimedAt:
        type: string
      createdAt:
        type: string
      finishedAt:
        type: string
      lastProgressAt:
        type: string
      message:
        example: Restored 3 partition(s) (412.5s)
        type: string
      progress:
        $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreProgressInfo'
      repositoryId:
        example: 3f2a9c1e6b7d4a80
        type: string
      restoreId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      restoreOutcome:
        description: |-
          RestoreOutcome is how the agent said the restore ended, kept apart from
          Status because a restored disk is not yet a system that boots.
        example: succeeded
        type: string
      sourceBackupSetId:
        example: 9c0d1e2f3a4b5c6d
        type: string
      sourceSystemId:
        example: 1a2b3c4d5e6f7081
        type: string
      status:
        description: Status is awaiting_agent, claimed, restoring, awaiting_boot or
          failed.
        example: restoring
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreInfo'
        type: array
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreProgressInfo:
    properties:
      item:
        description: Item is the backup file being restored, while extracting.
        example: web01-nvme0n1p1-1a2b3c4d5e6f7081.aha
        type: string
      phase:
        example: extracting
        type: string
      processedBytes:
        description: |-
          ProcessedBytes is how much has been read from the repository. TotalUnknown
          says TotalBytes is not known yet.
        example: 1048576
        type: integer
      step:
        example: 4
        type: integer
      totalBytes:
        example: 4294967296
        type: integer
      totalSteps:
        example: 6
        type: integer
      totalUnknown:
        example: false
        type: boolean
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreProgressReq:
    properties:
      item:
        description: Item is the backup file being restored, while extracting.
        example: web01-nvme0n1p1-1a2b3c4d5e6f7081.aha
        type: string
      phase:
        description: Phase is the step being carried out, e.g. "extracting".
        example: extracting
        type: string
      processedBytes:
        description: |-
          ProcessedBytes is how much of the backup files has been read from the
          repository; TotalBytes is their combined size.
        example: 1048576
        minimum: 0
        type: integer
      seq:
        description: Seq orders reports within a restore. An older one is ignored.
        example: 3
        minimum: 1
        type: integer
      step:
        description: Step and TotalSteps place Phase in the sequence, e.g. 4 of 6.
        example: 4
        minimum: 0
        type: integer
      totalBytes:
        example: 4294967296
        minimum: 0
        type: integer
      totalSteps:
        example: 6
        minimum: 0
        type: integer
    required:
    - phase
    - seq
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreReq:
    properties:
      backupSetId:
        description: |-
          BackupSetID must be a set a backup job reported as completed. That job
          says which system it captured and which repository holds it.
        example: 9c0d1e2f3a4b5c6d
        maxLength: 255
        type: string
    required:
    - backupSetId
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.RestoreResultReq:
    properties:
      message:
        example: Restored 3 partition(s) (412.5s)
        type: string
      outcome:
        description: Outcome is succeeded or failed.
        enum:
        - succeeded
        - failed
        example: succeeded
        type: string
      phase:
        description: Phase is the step the restore ended in.
        example: bootloader
        type: string
    required:
    - outcome
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg:
    properties:
      code:
        description: |-
          Code identifies a failure for programs to branch on; Message is for
          people and may be reworded. The management API sets it on the failures
          it answers itself; one turned away earlier, such as by the rate limiter,
          has only a message and its HTTP status.
        example: NOT_FOUND
        type: string
      message:
        example: Service ready
        type: string
    type: object
  github_com_cloud-barista_ai-ha_pkg_api_rest_model.SystemInventoryInfo:
    properties:
      ageSeconds:
        description: |-
          AgeSeconds is how long ago the agent read the system, by the framework's
          clock.
        example: 1200
        type: integer
      agentId:
        example: 9b1c2d3e4f5a6b7c
        type: string
      collectedAt:
        type: string
      complete:
        description: |-
          Complete is false when the agent could not account for every filesystem
          the system needs. Backup targets are then not chosen automatically.
        example: true
        type: boolean
      report:
        allOf:
        - $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentInventoryReq'
        description: Report is the inventory as the agent sent it.
      reportedAt:
        type: string
      stale:
        description: Stale says the reading is old enough that the system may have
          changed.
        example: false
        type: boolean
      systemId:
        example: 1a2b3c4d5e6f7081
        type: string
    type: object
info:
  contact: {}
  description: REST API of the AI-HA framework, which backs up and restores workloads
    across clouds.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-HA REST API
  version: 0.1.0
paths:
  /agent/health:
    post:
      consumes:
      - application/json
      description: 'Not implemented yet: answers 501. Will take a node''s measurements
        of its service and replication, and answer with its HA assignment. The system
        will come from the agent''s token, never from the body.'
      operationId: PostAgentHealth
      produces:
      - application/json
      responses:
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AgentToken: []
      summary: Report a node's health
      tags:
      - '[Agent] Health'
  /agent/inventory:
    post:
      consumes:
      - application/json
      description: 'Report the partitions that make up the calling agent''s system,
        so that a backup can be asked for without naming them by hand. The report
        replaces any earlier one: a system keeps one inventory, and its layout history
        lives in the backup manifests. An agent that could not account for every filesystem
        the system needs says so, and backup targets are then not chosen automatically.
        The system is taken from the agent''s token, never from the body.'
      operationId: PostAgentInventory
      parameters:
      - description: Inventory report
        in: body
        name: agentInventoryReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentInventoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AgentToken: []
      summary: Report what this system is made of
      tags:
      - '[Agent] Inventory'
  /agent/jobs:
    get:
      description: 'Long-poll for work assigned to the calling agent''s system. Returns
        the job as soon as one is waiting, or 204 when the wait elapses with nothing
        to do; the 204 is the normal idle path and must not be treated as an error
        or backed off. Receiving a job grants nothing: the agent must claim it and
        see the claim succeed before starting. Reaching this endpoint is also what
        marks the agent as alive.'
      operationId: GetAgentJobs
      parameters:
      - default: 45
        description: Seconds to wait for work, clamped to 5-45
        in: query
        name: wait
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJob'
        "204":
          description: No work is waiting
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AgentToken: []
      summary: Wait for work
      tags:
      - '[Agent] Jobs'
  /agent/jobs/{jobId}/claim:
    post:
      consumes:
      - application/json
      description: 'Take a job handed out by the long poll. Work must not start until
        this succeeds: two agents can be handed the same job and only the claim decides
        between them. Retrying with the same request key before any progress is reported
        returns the same attempt with a new lease token, since the first response
        was evidently lost. The response carries the repository the job writes to,
        credentials included, decrypted for this response; if it cannot be opened
        the claim is not recorded and may be retried.'
      operationId: PostAgentJobClaim
      parameters:
      - description: Job ID
        in: path
        name: jobId
        required: true
        type: string
      - description: Claim request
        in: body
        name: agentJobClaimReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobClaimReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobClaimResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - AgentToken: []
      summary: Claim a job
      tags:
      - '[Agent] Jobs'
  /agent/jobs/{jobId}/progress:
    post:
      consumes:
      - application/json
      description: 'Report on a running attempt and renew its lease. Send this periodically
        whether or not the work advanced: it is what keeps the lease alive. A cancel
        request travels back on the response, as there is no other path to an agent.'
      operationId: PostAgentJobProgress
      parameters:
      - description: Job ID
        in: path
        name: jobId
        required: true
        type: string
      - description: Progress report
        in: body
        name: agentJobProgressReq
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.AgentJobProgressReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
