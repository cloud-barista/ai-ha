        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - RestoreReportToken: []
      summary: Report progress on a restore
      tags:
      - '[Agent] Restore'
  /agent/restore/{recoveryId}/result:
    post:
      consumes:
      - application/json
      description: Called by the rescue agent when the restore ends. A succeeded restore
        waits for its boot to be confirmed; a failed one ends the job. Repeating the
        recorded result is accepted, since the agent cannot know whether its first
        report arrived; a different result is refused.
      operationId: PostRestoreResult
      parameters:
      - description: Recovery ID injected into the rescue instance
        in: path
        name: recoveryId
        required: true
        type: string
      - description: Result
        in: body
