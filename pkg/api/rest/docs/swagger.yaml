        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_ai-ha_pkg_api_rest_model.SimpleMsg'
      security:
      - RestoreReportToken: []
      summary: Report how a restore ended
      tags:
      - '[Agent] Restore'
